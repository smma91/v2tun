name: build

on:
  push:
    branches: [main, "integrate/**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

env:
  TAGS: desktop,production,with_quic,with_utls,with_wireguard,with_gvisor,with_naive_outbound,with_purego,with_openvpn,with_openconnect
  UNIT_TESTS: TestT$|TestRules|TestSniff|TestFakeIP|TestParseLinks|TestNewFormats|TestHostsStrip|TestXrayXHTTP|TestProcIP|TestPortUnreachable|TestHandler|TestDNSTCPNoPool|TestMonitor|TestTunAddr|TestRouteConflict

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet and unit tests
        shell: pwsh
        env:
          GOTOOLCHAIN: go1.26.11
        run: |
          go vet -tags $env:TAGS ./cmd/v2tun ./internal/...
          # the resource file clashes with the test binary's own manifest
          Rename-Item cmd/v2tun/rsrc_windows_amd64.syso rsrc.syso.bak
          go test -tags $env:TAGS -count=1 -run $env:UNIT_TESTS ./cmd/v2tun ./internal/...
          $code = $LASTEXITCODE
          Rename-Item cmd/v2tun/rsrc.syso.bak rsrc_windows_amd64.syso
          exit $code

      - name: Build
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { "0.0.0-dev+$($env:GITHUB_SHA.Substring(0, 7))" }
          ./build.ps1 -Version $version
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item v2tun.exe, LICENSE, THIRD_PARTY_NOTICES.md, README.md dist/
          Compress-Archive dist/* "v2tun-$version-windows-amd64.zip"
          (Get-FileHash "v2tun-$version-windows-amd64.zip" -Algorithm SHA256).Hash.ToLower() + "  v2tun-$version-windows-amd64.zip" | Out-File -Encoding ascii SHA256SUMS-windows.txt

      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: |
            v2tun-*.zip
            SHA256SUMS-windows.txt

  linux:
    # The oldest supported base: binaries built here run on Ubuntu 22.04+,
    # Debian 12+, Fedora 37+ and other distributions with WebKitGTK 4.1.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.0
          sudo curl -sSLo /usr/local/bin/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Vet and unit tests
        env:
          GOTOOLCHAIN: go1.26.11
        run: |
          go vet -tags "$TAGS,webkit2_41" ./cmd/v2tun ./internal/...
          go test -tags "$TAGS,webkit2_41" -count=1 -run "$UNIT_TESTS" ./cmd/v2tun ./internal/...

      - name: Packages
        env:
          GOTOOLCHAIN: go1.26.11
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="${GITHUB_REF_NAME#v}"; else version="0.0.0~dev.${GITHUB_SHA::7}"; fi
          build/linux/package.sh "$version"

      - uses: actions/upload-artifact@v5
        with:
          name: linux
          path: dist/*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Mobile package tests
        env:
          GOTOOLCHAIN: go1.26.11
        run: go test -tags with_gvisor,with_quic,with_wireguard,with_utls,badlinkname,tfogo_checklinkname0 -ldflags=-checklinkname=0 -count=1 ./mobile

      - name: Go library (gomobile)
        env:
          GOTOOLCHAIN: go1.26.11
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          bash build/android/build-aar.sh

      - name: APKs
        env:
          V2TUN_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          V2TUN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          V2TUN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          V2TUN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then export V2TUN_VERSION="${GITHUB_REF_NAME#v}"; else export V2TUN_VERSION="0.0.0-dev"; fi
          if [ -n "$V2TUN_KEYSTORE_BASE64" ]; then
            echo "$V2TUN_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export V2TUN_KEYSTORE="$RUNNER_TEMP/release.jks"
          fi
          cd android
          ./gradlew assembleRelease --no-daemon --console=plain
          mkdir -p ../dist
          for f in app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$f" | sed -e 's/^app-//' -e 's/-release.apk$//')
            cp "$f" "../dist/v2tun-$V2TUN_VERSION-android-$abi.apk"
          done
          # Android TV: the 32-bit ARM build installs on practically every TV and box
          # (many have a 64-bit processor but 32-bit Android).
          cp "../dist/v2tun-$V2TUN_VERSION-android-armeabi-v7a.apk" "../dist/v2tun-$V2TUN_VERSION-android-tv.apk"
          cd ../dist && sha256sum ./*.apk > SHA256SUMS-android.txt && ls -la

      - uses: actions/upload-artifact@v5
        with:
          name: android
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true

      - name: Checksums
        run: |
          cd out
          cat SHA256SUMS-*.txt | sed 's| \./| |' > SHA256SUMS.txt
          rm SHA256SUMS-*.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: out/*
